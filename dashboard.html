<!DOCTYPE html>

<head>

    <title>Dashboard | BlogHub</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"

<body>

    <header>

        <div class="logo">
            <i class="fa-solid fa-book-open"></i> BlogHub

        <nav>

            <ul>

                <li><a href="index.html">Home</a></li>

                <li><a href="dashboard.html" class="active">Dashboard</a></li>

                <i class="fa-solid fa-plus"></i>

                    <h3>Learning HTML</h3>

                    <p>
                        HTML is the foundation of every website.
                    </p>

                    <div class="blog-actions">

                        <button class="edit-btn">
                            <i class="fa-solid fa-pen"></i>
                            Edit
                        </button>

                        <button class="delete-btn">
                            <i class="fa-solid fa-trash"></i>
                            Delete
                        </button>

                    </div>

                </div>

            </div>

            <div class="blog-card">

                <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=600">

                    <p>

                    <div class="blog-actions">

                        <button class="edit-btn">
                            <i class="fa-solid fa-pen"></i>
                            Edit
                        </button>

                        <button class="delete-btn">
                            <i class="fa-solid fa-trash"></i>
                            Delete
                        </button>

                    </div>

                </div>

                <img src="https://images.unsplash.com/photo-1515879218367-8466d910aaa4?w=600">

                    <p>

                    </p>

                    <div class="blog-actions">

                        <button class="edit-btn">
                            <i class="fa-solid fa-pen"></i>
                            Edit
                        </button>

                        <button class="delete-btn">
                            <i class="fa-solid fa-trash"></i>
                            Delete
                        </button>

                    </div>
